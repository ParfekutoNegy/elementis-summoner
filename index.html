<script>

// ============================================================
// トップメニュー 縦表示固定
// ============================================================


function resizeMenu(){

    const viewport =
        document.getElementById(
            "top-viewport"
        );

    const screen =
        document.getElementById(
            "top-screen"
        );

    if(!viewport || !screen){
        return;
    }

    //----------------------------------
    // 実際の表示領域
    //----------------------------------

    const visual = window.visualViewport;

    const width = visual
        ? visual.width
        : window.innerWidth;

    const height = visual
        ? visual.height
        : window.innerHeight;

    if(width <= 0 || height <= 0){
        return;
    }

    //----------------------------------
    // 横向き判定
    //----------------------------------

    const isLandscape = width > height;

    const isTouchDevice =
        window.matchMedia(
            "(pointer: coarse)"
        ).matches;

    //----------------------------------
    // ホーム画面起動判定
    //----------------------------------

    const isStandalone =
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true;

    if(isLandscape && isTouchDevice){

        let menuWidth = height;
        let menuHeight = width;
        let scale = 1;

        //----------------------------------
        // ブラウザ起動時だけ縮小調整
        //----------------------------------

        if(!isStandalone){

            const referenceWidth = 390;

            if(menuWidth < referenceWidth){

                scale = menuWidth / referenceWidth;

                menuWidth = referenceWidth;

                menuHeight = width / scale;

            }

        }

        screen.style.setProperty(
            "--menu-width",
            `${menuWidth}px`
        );

        screen.style.setProperty(
            "--menu-height",
            `${menuHeight}px`
        );

        screen.style.setProperty(
            "--menu-scale",
            `${scale}`
        );

    }else{

        screen.style.removeProperty(
            "--menu-width"
        );

        screen.style.removeProperty(
            "--menu-height"
        );

        screen.style.removeProperty(
            "--menu-scale"
        );

    }

}



// ============================================================
// 回転・サイズ変更時の再計算
// ============================================================

let menuResizeTimers = [];

function scheduleMenuResize(){

    // ----------------------------------
    // 前回のタイマーを解除
    // ----------------------------------

    menuResizeTimers.forEach(
        timer => clearTimeout(timer)
    );

    menuResizeTimers = [];


    // ----------------------------------
    // 即時更新
    // ----------------------------------

    resizeMenu();


    // ----------------------------------
    // 次の描画タイミングで更新
    // ----------------------------------

    requestAnimationFrame(
        resizeMenu
    );


    // ----------------------------------
    // 画面回転後の段階的な更新
    // ----------------------------------

    const delays = [
        100,
        300,
        600
    ];


    delays.forEach(
        delay => {

            const timer =
                setTimeout(
                    resizeMenu,
                    delay
                );

            menuResizeTimers.push(
                timer
            );

        }
    );

}


// ============================================================
// 初期表示
// ============================================================

window.addEventListener(
    "DOMContentLoaded",
    scheduleMenuResize
);


// ============================================================
// 画面サイズ変更
// ============================================================

window.addEventListener(
    "resize",
    scheduleMenuResize
);


// ============================================================
// スマホ回転
// ============================================================

window.addEventListener(
    "orientationchange",
    scheduleMenuResize
);


// ============================================================
// iPhone表示領域変更
// ============================================================

if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        scheduleMenuResize
    );

}

</script>
