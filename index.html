<script>

// ============================================================
// トップメニュー 縦表示固定
// ============================================================


function resizeMenu(){

    const viewport =
        document.getElementById(
            "top-viewport"
        );

    const screen =
        document.getElementById(
            "top-screen"
        );

    if(!viewport || !screen){
        return;
    }

    //----------------------------------
    // 実際の表示領域
    //----------------------------------

    const visual = window.visualViewport;

    const width = visual
        ? visual.width
        : window.innerWidth;

    const height = visual
        ? visual.height
        : window.innerHeight;

    if(width <= 0 || height <= 0){
        return;
    }

    //----------------------------------
    // 横向き判定
    //----------------------------------

    const isLandscape = width > height;

    const isTouchDevice =
        window.matchMedia(
            "(pointer: coarse)"
        ).matches;

    //----------------------------------
    // ホーム画面起動判定
    //----------------------------------

    const isStandalone =
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true;

    if(isLandscape && isTouchDevice){

        let menuWidth = height;
        let menuHeight = width;
        let scale = 1;

        //----------------------------------
        // ブラウザ起動時だけ縮小調整
        //----------------------------------

        if(!isStandalone){

            const referenceWidth = 390;

            if(menuWidth < referenceWidth){

                scale = menuWidth / referenceWidth;

                menuWidth = referenceWidth;

                menuHeight = width / scale;

            }

        }

        screen.style.setProperty(
            "--menu-width",
            `${menuWidth}px`
        );

        screen.style.setProperty(
            "--menu-height",
            `${menuHeight}px`
        );

        screen.style.setProperty(
            "--menu-scale",
            `${scale}`
        );

    }else{

        screen.style.removeProperty(
            "--menu-width"
        );

        screen.style.removeProperty(
            "--menu-height"
        );

        screen.style.removeProperty(
            "--menu-scale"
        );

    }

}



// ============================================================
// 回転・サイズ変更時の再計算
// ============================================================

let menuResizeTimers = [];

function scheduleMenuResize(){

    // ----------------------------------
    // 前回のタイマーを解除
    // ----------------------------------

    menuResizeTimers.forEach(
        timer => clearTimeout(timer)
    );

    menuResizeTimers = [];


    // ----------------------------------
    // 即時更新
    // ----------------------------------

    resizeMenu();


    // ----------------------------------
    // 次の描画タイミングで更新
    // ----------------------------------

    requestAnimationFrame(
        resizeMenu
    );


    // ----------------------------------
    // 画面回転後の段階的な更新
    // ----------------------------------

    const delays = [
        100,
        300,
        600
    ];


    delays.forEach(
        delay => {

            const timer =
                setTimeout(
                    resizeMenu,
                    delay
                );

            menuResizeTimers.push(
                timer
            );

        }
    );

}


// ============================================================
// 初期表示
// ============================================================

window.addEventListener(
    "DOMContentLoaded",
    scheduleMenuResize
);


// ============================================================
// 画面サイズ変更
// ============================================================

window.addEventListener(
    "resize",
    scheduleMenuResize
);


// ============================================================
// スマホ回転
// ============================================================

window.addEventListener(
    "orientationchange",
    scheduleMenuResize
);


// ============================================================
// iPhone表示領域変更
// ============================================================

if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        scheduleMenuResize
    );

}

</script>

     ホーム画面追加の案内
========================= -->

<div id="home-install-modal">

            type="button"
            id="home-install-close"
        >
            閉じる
        </button>

<script>

// ============================================================
// ホーム画面に追加
// ============================================================

let deferredInstallPrompt = null;


// ----------------------------------
// アプリ起動判定
// ----------------------------------

function isHomeScreenMode(){

    return (
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches ||

        window.matchMedia(
            "(display-mode: fullscreen)"
        ).matches ||

        window.navigator.standalone === true
    );

}


// ----------------------------------
// インストール可能イベント
// ----------------------------------

window.addEventListener(
    "beforeinstallprompt",
    event => {

        event.preventDefault();

        deferredInstallPrompt = event;

    }
);


// ----------------------------------
// 初期化
// ----------------------------------

function initializeHomeInstall(){

    const area =
        document.getElementById(
            "home-install-area"
        );

    const button =
        document.getElementById(
            "home-install-button"
        );

    const modal =
        document.getElementById(
            "home-install-modal"
        );

    const guide =
        document.getElementById(
            "home-install-guide"
        );

    const close =
        document.getElementById(
            "home-install-close"
        );

    if(
        !area ||
        !button ||
        !modal ||
        !guide ||
        !close
    ){
        return;
    }


    // ----------------------------------
    // ホーム画面から起動している場合
    // ----------------------------------

    if(isHomeScreenMode()){

        area.style.display = "none";

        return;

    }


    // ----------------------------------
    // ブラウザから起動している場合
    // ----------------------------------

    area.style.display = "block";


    // ----------------------------------
    // ボタンを押したとき
    // ----------------------------------

    button.addEventListener(
        "click",
        async () => {

            // Androidなどのインストール画面

            if(deferredInstallPrompt){

                const promptEvent =
                    deferredInstallPrompt;

                deferredInstallPrompt = null;

                try{

                    await promptEvent.prompt();

                    await promptEvent.userChoice;

                }catch(error){

                    console.error(
                        "インストール案内エラー",
                        error
                    );

                }

                return;

            }


            // ----------------------------------
            // iPhone / iPad 判定
            // ----------------------------------

            const isIOS =
                /iPhone|iPad|iPod/.test(
                    navigator.userAgent
                ) ||
                (
                    navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1
                );


            if(isIOS){

                guide.textContent =
                    "1. Safariでこのページを開きます。\n" +
                    "2. 共有ボタンを押します。\n" +
                    "3.「ホーム画面に追加」を選びます。\n" +
                    "4.「追加」を押してください。";

            }else{

                guide.textContent =
                    "ブラウザのメニューから\n" +
                    "「ホーム画面に追加」または\n" +
                    "「アプリをインストール」を\n" +
                    "選択してください。";

            }


            modal.style.display = "flex";

        }
    );


    // ----------------------------------
    // 閉じる
    // ----------------------------------

    close.addEventListener(
        "click",
        () => {

            modal.style.display = "none";

        }
    );


    modal.addEventListener(
        "click",
        event => {

            if(event.target === modal){

                modal.style.display = "none";

            }

        }
    );

}


// ----------------------------------
// インストール完了
// ----------------------------------

window.addEventListener(
    "appinstalled",
    () => {

        deferredInstallPrompt = null;

        // インストール直後も通常ブラウザなら
        // 案内を残し、アプリ起動時に非表示にする

    }
);


// ----------------------------------
// 初期表示
// ----------------------------------

if(document.readyState === "loading"){

    document.addEventListener(
        "DOMContentLoaded",
        initializeHomeInstall
    );

}else{

    initializeHomeInstall();

}

</script>
