<!-- チャレンジモード処理 -->
<script src="challenge.js"></script>


<script>

/* =========================================================
チャレンジモード選択画面 縦表示固定
========================================================= */

function resizeChallengeMenu(){

    const viewport =
        document.getElementById(
            "random-select-viewport"
        );

    if(!viewport){
        return;
    }

    //----------------------------------
    // 実際の表示領域
    //----------------------------------

    const visual =
        window.visualViewport;

    const width =
        visual
            ? visual.width
            : window.innerWidth;

    const height =
        visual
            ? visual.height
            : window.innerHeight;

    if(width <= 0 || height <= 0){
        return;
    }

    //----------------------------------
    // スマホ横向き判定
    //----------------------------------

    const isLandscape =
        width > height;

    const isTouchDevice =
        window.matchMedia(
            "(pointer: coarse)"
        ).matches;

    //----------------------------------
    // ホーム画面起動判定
    //----------------------------------

    const isStandalone =
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true;

    //----------------------------------
    // 横向き表示
    //----------------------------------

    if(isLandscape && isTouchDevice){

        let menuWidth = height;
        let menuHeight = width;
        let scale = 1;

        //----------------------------------
        // ブラウザ起動時だけ縮小調整
        //----------------------------------

        if(!isStandalone){

            const referenceWidth = 390;

            if(menuWidth < referenceWidth){

                scale =
                    menuWidth / referenceWidth;

                menuWidth =
                    referenceWidth;

                menuHeight =
                    width / scale;

            }

        }

        viewport.style.setProperty(
            "--random-menu-width",
            `${menuWidth}px`
        );

        viewport.style.setProperty(
            "--random-menu-height",
            `${menuHeight}px`
        );

        viewport.style.setProperty(
            "--random-menu-scale",
            `${scale}`
        );

    }else{

        viewport.style.removeProperty(
            "--random-menu-width"
        );

        viewport.style.removeProperty(
            "--random-menu-height"
        );

        viewport.style.removeProperty(
            "--random-menu-scale"
        );

    }

}


/* =========================================================
回転・サイズ変更時の再計算
========================================================= */

let challengeResizeTimers = [];

function scheduleChallengeMenuResize(){

    challengeResizeTimers.forEach(
        timer => clearTimeout(timer)
    );

    challengeResizeTimers = [];

    resizeChallengeMenu();

    requestAnimationFrame(
        resizeChallengeMenu
    );

    const delays = [
        100,
        300,
        600
    ];

    delays.forEach(
        delay => {

            const timer =
                setTimeout(
                    resizeChallengeMenu,
                    delay
                );

            challengeResizeTimers.push(
                timer
            );

        }
    );

}


/* =========================================================
イベント登録
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    scheduleChallengeMenuResize
);

window.addEventListener(
    "resize",
    scheduleChallengeMenuResize
);

window.addEventListener(
    "orientationchange",
    scheduleChallengeMenuResize
);

if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        scheduleChallengeMenuResize
    );

}

</script>
