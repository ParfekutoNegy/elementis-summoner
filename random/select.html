<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ランダムルール選択 - Elementis Summoner</title>

    <link rel="stylesheet" href="select.css">
</head>

<body>

<div id="random-select-viewport">

    <div id="random-select-screen">

    <!-- =========================
         タイトル
    ========================= -->

    <header>
        <h1>ランダムルール</h1>
    </header>

    <main>

        <p class="select-guide">
            対戦するカードセットを選択してください
        </p>

        <!-- =========================
             ベーシック
        ========================= -->

        <button
            type="button"
            class="rule-button"
            onclick="startRandomRule(1)"
        >
            <span class="rule-name">
                ベーシック
            </span>

        </button>


        <!-- =========================
             フォークロア
        ========================= -->

        <button
            type="button"
            class="rule-button"
            onclick="startRandomRule(2)"
        >
            <span class="rule-name">
                フォークロア
            </span>

        </button>


        <!-- =========================
             ミソロジー
        ========================= -->

        <button
            type="button"
            class="rule-button"
            onclick="startRandomRule(3)"
        >
            <span class="rule-name">
                ミソロジー
            </span>

        </button>


        <!-- =========================
             オールカード
        ========================= -->

        <section id="all-card-section">

            <h2>オールカード</h2>

            <p class="setting-guide">
                デッキに含めるカード種類の最低枚数を設定
            </p>


            <!-- サモン -->

            <div class="setting-row">

                <label for="summon-min">
                    サモン
                </label>

                <select id="summon-min">
                    <option value="0">0枚</option>
                    <option value="1">1枚</option>
                    <option value="2" selected>2枚</option>
                    <option value="3">3枚</option>
                    <option value="4">4枚</option>
                    <option value="5">5枚</option>
                </select>

                <span>以上</span>

            </div>


            <!-- マギア -->

            <div class="setting-row">

                <label for="magia-min">
                    マギア
                </label>

                <select id="magia-min">
                    <option value="0">0枚</option>
                    <option value="1">1枚</option>
                    <option value="2" selected>2枚</option>
                    <option value="3">3枚</option>
                    <option value="4">4枚</option>
                    <option value="5">5枚</option>
                </select>

                <span>以上</span>

            </div>


            <!-- レジスト -->

            <div class="setting-row">

                <label for="resist-min">
                    レジスト
                </label>

                <select id="resist-min">
                    <option value="0">0枚</option>
                    <option value="1">1枚</option>
                    <option value="2" selected>2枚</option>
                    <option value="3">3枚</option>
                    <option value="4">4枚</option>
                    <option value="5">5枚</option>
                </select>

                <span>以上</span>

            </div>


            <!-- 設定結果 -->

            <p id="setting-summary"></p>

            <p id="setting-error"></p>


            <!-- 対戦開始 -->

            <button
                type="button"
                id="all-card-start"
                class="rule-button"
                onclick="startAllCardRule()"
            >
                オールカードで対戦開始
            </button>

        </section>


        <!-- =========================
             戻る
        ========================= -->

        <a
            class="back-button"
            href="../index.html"
        >
            ホームに戻る
        </a>

    </main>

    </div>

</div>


<script src="select.js"></script>

<script>


 // ============================================================
 // ランダムルール選択画面 縦表示固定
 // ============================================================


function resizeRandomMenu(){

    const viewport =
        document.getElementById(
            "random-select-viewport"
        );

    if(!viewport){
        return;
    }

    //----------------------------------
    // 実際の表示領域
    //----------------------------------

    const visual =
        window.visualViewport;

    const width =
        visual
            ? visual.width
            : window.innerWidth;

    const height =
        visual
            ? visual.height
            : window.innerHeight;

    if(width <= 0 || height <= 0){
        return;
    }

    //----------------------------------
    // スマホ横向き判定
    //----------------------------------

    const isLandscape =
        width > height;

    const isTouchDevice =
        window.matchMedia(
            "(pointer: coarse)"
        ).matches;

    //----------------------------------
    // ホーム画面起動判定
    //----------------------------------

    const isStandalone =
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true;

    //----------------------------------
    // 横向き表示
    //----------------------------------

    if(isLandscape && isTouchDevice){

        let menuWidth = height;
        let menuHeight = width;
        let scale = 1;

        //----------------------------------
        // ブラウザ起動時だけ縮小調整
        //----------------------------------

        if(!isStandalone){

            const referenceWidth = 390;

            if(menuWidth < referenceWidth){

                scale =
                    menuWidth / referenceWidth;

                menuWidth =
                    referenceWidth;

                menuHeight =
                    width / scale;

            }

        }

        viewport.style.setProperty(
            "--random-menu-width",
            `${menuWidth}px`
        );

        viewport.style.setProperty(
            "--random-menu-height",
            `${menuHeight}px`
        );

        viewport.style.setProperty(
            "--random-menu-scale",
            `${scale}`
        );

    }else{

        viewport.style.removeProperty(
            "--random-menu-width"
        );

        viewport.style.removeProperty(
            "--random-menu-height"
        );

        viewport.style.removeProperty(
            "--random-menu-scale"
        );

    }

}



// ============================================================
// 回転・サイズ変更時の再計算
// ============================================================

let randomResizeTimers = [];

function scheduleRandomMenuResize(){

    // ----------------------------------
    // 前回のタイマーを解除
    // ----------------------------------

    randomResizeTimers.forEach(
        timer => clearTimeout(timer)
    );

    randomResizeTimers = [];


    // ----------------------------------
    // 即時更新
    // ----------------------------------

    resizeRandomMenu();


    // ----------------------------------
    // 次の描画タイミングで更新
    // ----------------------------------

    requestAnimationFrame(
        resizeRandomMenu
    );


    // ----------------------------------
    // 回転後の段階的な更新
    // ----------------------------------

    const delays = [
        100,
        300,
        600
    ];


    delays.forEach(
        delay => {

            const timer =
                setTimeout(
                    resizeRandomMenu,
                    delay
                );

            randomResizeTimers.push(
                timer
            );

        }
    );

}


// ============================================================
// 初期表示
// ============================================================

window.addEventListener(
    "DOMContentLoaded",
    scheduleRandomMenuResize
);


// ============================================================
// 画面サイズ変更
// ============================================================

window.addEventListener(
    "resize",
    scheduleRandomMenuResize
);


// ============================================================
// スマホ回転
// ============================================================

window.addEventListener(
    "orientationchange",
    scheduleRandomMenuResize
);


// ============================================================
// iPhone表示領域変更
// ============================================================

if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        scheduleRandomMenuResize
    );

}


</script>

</body>
</html>
