<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ビルドルール - Elementis Summoner</title>

    <link
        rel="stylesheet"
        href="build.css">

</head>


<body>

<div id="build-viewport">

    <div id="build-screen">


    <!-- =========================
         ヘッダー
    ========================= -->

    <header id="build-header">

        <div id="build-title-area">

            <h1>
                ビルドルール
            </h1>

            <p>
                レギュレーション・ライフ・使用デッキを選択してください
            </p>

        </div>

    </header>


    <!-- =========================
         ゲーム条件
    ========================= -->

    <section id="settings-section">

<!-- =========================
     レギュレーション
========================= -->

<div class="setting-box regulation-setting-box">


<div class="regulation-label-row">

    <label>
        レギュレーション
    </label>

    <button
        type="button"
        id="regulation-help-button"
        onclick="openRegulationHelp()">

        説明

    </button>

</div>

<div id="regulation-buttons">

        <button
            type="button"
            class="regulation-button"
            data-regulation="basic">
            ベーシック
        </button>

        <button
            type="button"
            class="regulation-button"
            data-regulation="folklore">
            フォークロア
        </button>

        <button
            type="button"
            class="regulation-button"
            data-regulation="mythology">
            ミソロジー
        </button>

        <button
            type="button"
            class="regulation-button selected"
            data-regulation="all">
            オールカード
        </button>

    </div>

</div>


        <!-- ライフ -->

        <div class="setting-box">

            <label
                for="life-select">

                ライフ

            </label>

            <select
                id="life-select">

                <option value="1">
                    1
                </option>

                <option value="2">
                    2
                </option>

                <option value="3">
                    3
                </option>

                <option value="4">
                    4
                </option>

                <option
                    value="5"
                    selected>

                    5

                </option>

            </select>

            <p
                id="life-description"
                class="setting-description">

                オールカードではライフ5固定

            </p>

        </div>

    </section>


    <!-- =========================
         デッキ選択
    ========================= -->

    <section id="deck-section">

        <div class="section-title">

            <h2>
                使用デッキ
            </h2>

            <p id="deck-count">
                0個のデッキ
            </p>

        </div>


        <div id="saved-decks">

            <!-- build.jsで生成 -->

        </div>

    </section>


    <!-- =========================
         ゲーム開始
    ========================= -->

<!-- =========================
     下部固定操作エリア
========================= -->

<div id="fixed-action-area">

    <button
        id="back-button"
        type="button"
        onclick="backToHome()">

        ホームに戻る

    </button>


    <div id="selected-deck-message">

        デッキを選んでください

    </div>


    <button
        id="start-game-button"
        type="button"
        onclick="startBuildGame()"
        disabled>

        ゲーム開始

    </button>

</div>

</div>


<!-- =========================
     デッキリスト表示モーダル
========================= -->

<div
    id="deck-list-modal"
    class="deck-list-modal">

    <div class="deck-list-modal-content">

        <!-- ヘッダー -->

        <div class="deck-list-modal-header">

            <h2 id="deck-list-modal-title">
                デッキリスト
            </h2>

        </div>


        <!-- メインデッキ -->

        <section class="deck-list-group">

            <h3>
                MAIN DECK
            </h3>

            <div
                id="modal-main-deck"
                class="modal-card-grid">

                <!-- build.jsで生成 -->

            </div>

        </section>


        <!-- サイドデッキ -->

        <section class="deck-list-group">

            <h3>
                SIDE DECK
            </h3>

            <div
                id="modal-side-deck"
                class="modal-card-grid">

                <!-- build.jsで生成 -->

            </div>

        </section>


        <!-- 閉じる -->

        <button
            type="button"
            id="deck-list-modal-bottom-close"
            onclick="closeDeckListModal()">

            閉じる

        </button>

    </div>

</div>


<!-- =========================================
     レギュレーション説明モーダル
========================================= -->

<div
    id="regulation-help-modal"
    class="regulation-help-modal"
    onclick="closeRegulationHelp()">

    <div
        class="regulation-help-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="regulation-help-title"
        onclick="event.stopPropagation()">

        <h2 id="regulation-help-title">
            レギュレーション
        </h2>

        <div class="regulation-help-item">
            <h3>ベーシック</h3>
            <p>
                Basicのカード(No.001～032)のみ
                使用可能
            </p>
        </div>

        <div class="regulation-help-item">
            <h3>フォークロア</h3>
            <p>
                Folkloreのカード(No.033～064)のみ
                使用可能
            </p>
        </div>

        <div class="regulation-help-item">
            <h3>ミソロジー</h3>
            <p>
                Mythologyのカード(No.065～096)のみ
                使用可能
            </p>
        </div>

        <div class="regulation-help-item">
            <h3>オールカード</h3>
            <p>
                すべてのカードが使用可能
            </p>
        </div>

        <button
            type="button"
            id="regulation-help-close"
            onclick="closeRegulationHelp()">

            閉じる

        </button>


    </div>

</div>

<!-- build-viewport 終了 -->
</div>


<script src="../deck/cards.js"></script>

<script src="build.js"></script>

<script>


 // ============================================================
 // ビルドルールメニュー 縦表示固定
 // ============================================================


function resizeBuildMenu(){

    const viewport =
        document.getElementById(
            "build-viewport"
        );

    if(!viewport){
        return;
    }

    //----------------------------------
    // 実際の表示領域
    //----------------------------------

    const visual = window.visualViewport;

    const width = visual
        ? visual.width
        : window.innerWidth;

    const height = visual
        ? visual.height
        : window.innerHeight;

    if(width <= 0 || height <= 0){
        return;
    }

    //----------------------------------
    // スマホ横向き判定
    //----------------------------------

    const isLandscape = width > height;

    const isTouchDevice =
        window.matchMedia(
            "(pointer: coarse)"
        ).matches;

    //----------------------------------
    // ホーム画面起動判定
    //----------------------------------

    const isStandalone =
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true;

    if(isLandscape && isTouchDevice){

        let menuWidth = height;
        let menuHeight = width;
        let scale = 1;

        //----------------------------------
        // ブラウザ起動時だけ縮小調整
        //----------------------------------

        if(!isStandalone){

            const referenceWidth = 390;

            if(menuWidth < referenceWidth){

                scale = menuWidth / referenceWidth;

                menuWidth = referenceWidth;

                menuHeight = width / scale;

            }

        }

        viewport.style.setProperty(
            "--build-menu-width",
            `${menuWidth}px`
        );

        viewport.style.setProperty(
            "--build-menu-height",
            `${menuHeight}px`
        );

        viewport.style.setProperty(
            "--build-menu-scale",
            `${scale}`
        );

    }else{

        viewport.style.removeProperty(
            "--build-menu-width"
        );

        viewport.style.removeProperty(
            "--build-menu-height"
        );

        viewport.style.removeProperty(
            "--build-menu-scale"
        );

    }

}



// ============================================================
// 回転・サイズ変更時の再計算
// ============================================================

let buildResizeTimers = [];

function scheduleBuildMenuResize(){

    // ----------------------------------
    // 前回のタイマーを解除
    // ----------------------------------

    buildResizeTimers.forEach(
        timer => clearTimeout(timer)
    );

    buildResizeTimers = [];


    // ----------------------------------
    // 即時更新
    // ----------------------------------

    resizeBuildMenu();


    // ----------------------------------
    // 次の描画タイミングで更新
    // ----------------------------------

    requestAnimationFrame(
        resizeBuildMenu
    );


    // ----------------------------------
    // 回転後の段階的な更新
    // ----------------------------------

    const delays = [
        100,
        300,
        600
    ];


    delays.forEach(
        delay => {

            const timer =
                setTimeout(
                    resizeBuildMenu,
                    delay
                );

            buildResizeTimers.push(
                timer
            );

        }
    );

}


// ============================================================
// 初期表示
// ============================================================

window.addEventListener(
    "DOMContentLoaded",
    scheduleBuildMenuResize
);


// ============================================================
// 画面サイズ変更
// ============================================================

window.addEventListener(
    "resize",
    scheduleBuildMenuResize
);


// ============================================================
// 画面回転
// ============================================================

window.addEventListener(
    "orientationchange",
    scheduleBuildMenuResize
);


// ============================================================
// iPhone表示領域変更
// ============================================================

if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        scheduleBuildMenuResize
    );

}


</script>

</body>
</html>


</html>
