<script>


// ============================================================
// チュートリアルメニュー 縦表示固定
// ============================================================


function resizeTutorialMenu(){

    const viewport =
        document.getElementById(
            "tutorial-menu-viewport"
        );

    if(!viewport){
        return;
    }

    //----------------------------------
    // 実際の表示領域
    //----------------------------------

    const visual =
        window.visualViewport;

    const width =
        visual
            ? visual.width
            : window.innerWidth;

    const height =
        visual
            ? visual.height
            : window.innerHeight;

    if(width <= 0 || height <= 0){
        return;
    }

    //----------------------------------
    // スマホ横向き判定
    //----------------------------------

    const isLandscape =
        width > height;

    const isTouchDevice =
        window.matchMedia(
            "(pointer: coarse)"
        ).matches;

    //----------------------------------
    // ホーム画面起動判定
    //----------------------------------

    const isStandalone =
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true;

    //----------------------------------
    // 横向き表示
    //----------------------------------

    if(isLandscape && isTouchDevice){

        let menuWidth = height;
        let menuHeight = width;
        let scale = 1;

        //----------------------------------
        // ブラウザ起動時だけ縮小調整
        //----------------------------------

        if(!isStandalone){

            const referenceWidth = 390;

            if(menuWidth < referenceWidth){

                scale =
                    menuWidth / referenceWidth;

                menuWidth =
                    referenceWidth;

                menuHeight =
                    width / scale;

            }

        }

        //----------------------------------
        // CSS変数を更新
        //----------------------------------

        viewport.style.setProperty(
            "--tutorial-menu-width",
            `${menuWidth}px`
        );

        viewport.style.setProperty(
            "--tutorial-menu-height",
            `${menuHeight}px`
        );

        viewport.style.setProperty(
            "--tutorial-menu-scale",
            `${scale}`
        );

    }else{

        //----------------------------------
        // 縦向きでは通常表示
        //----------------------------------

        viewport.style.removeProperty(
            "--tutorial-menu-width"
        );

        viewport.style.removeProperty(
            "--tutorial-menu-height"
        );

        viewport.style.removeProperty(
            "--tutorial-menu-scale"
        );

    }

}



// ============================================================
// 回転・サイズ変更時の再計算
// ============================================================

let tutorialResizeTimers = [];

function scheduleTutorialMenuResize(){

    // ----------------------------------
    // 前回のタイマーを解除
    // ----------------------------------

    tutorialResizeTimers.forEach(
        timer => clearTimeout(timer)
    );

    tutorialResizeTimers = [];


    // ----------------------------------
    // 即時更新
    // ----------------------------------

    resizeTutorialMenu();


    // ----------------------------------
    // 次の描画タイミングで更新
    // ----------------------------------

    requestAnimationFrame(
        resizeTutorialMenu
    );


    // ----------------------------------
    // 回転後の段階的な更新
    // ----------------------------------

    const delays = [
        100,
        300,
        600
    ];


    delays.forEach(
        delay => {

            const timer =
                setTimeout(
                    resizeTutorialMenu,
                    delay
                );

            tutorialResizeTimers.push(
                timer
            );

        }
    );

}


// ============================================================
// 初期表示
// ============================================================

window.addEventListener(
    "DOMContentLoaded",
    scheduleTutorialMenuResize
);


// ============================================================
// 画面サイズ変更
// ============================================================

window.addEventListener(
    "resize",
    scheduleTutorialMenuResize
);


// ============================================================
// スマホ回転
// ============================================================

window.addEventListener(
    "orientationchange",
    scheduleTutorialMenuResize
);


// ============================================================
// iPhone表示領域変更
// ============================================================

if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        scheduleTutorialMenuResize
    );

}


</script>
